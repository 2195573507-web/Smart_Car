name: SmartCarIOS

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  SmartCarIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - IconDrafts/**
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "SmartCar IOS uses Bluetooth to scan and connect to SmartCar_S3."
        NSBluetoothPeripheralUsageDescription: "SmartCar IOS uses Bluetooth to communicate with SmartCar_S3."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartcar.iosapp
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - sdk: SceneKit.framework
      - sdk: CoreBluetooth.framework
      - sdk: SwiftUI.framework
