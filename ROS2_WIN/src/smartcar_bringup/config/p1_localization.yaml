# Project-reviewed localization parameters.  The posegraph path and starting
# pose are supplied by localization.launch.py so this file remains portable.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    use_sim_time: false
    mode: localization
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    map_name: /map
    map_file_name: ""
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: false
    use_map_saver: false
    enable_interactive_mode: false
    scan_queue_size: 1
    scan_buffer_size: 10
    resolution: 0.05
    min_laser_range: 0.10
    max_laser_range: 8.0
    minimum_time_interval: 0.10
    transform_timeout: 0.20
    transform_publish_period: 0.02
    throttle_scans: 1
    tf_buffer_duration: 30.0
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    do_loop_closing: false
    debug_logging: false
