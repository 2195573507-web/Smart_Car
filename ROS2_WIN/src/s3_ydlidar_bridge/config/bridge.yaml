s3_ydlidar_bridge:
  ros__parameters:
    # Live S3 framing is intentionally unavailable until its wire contract is frozen.
    transport: unconfigured
    replay_file: ""
    scan_topic: /scan
    diagnostics_topic: /diagnostics
    tcp_listen_address: 0.0.0.0
    tcp_listen_port: 8765
    tcp_max_buffer_bytes: 262144
    tcp_max_ready_frames: 64
    s3_expected_version: 1
    s3_expected_message_type: 1
    s3_allowed_flags_mask: 1
    s3_expected_device_id: 1
    s3_expected_stream_id: 1
    # SRP v4 chassis state is the reviewed opaque type. Recognizing type 2 at
    # the outer dispatcher does not authorize live consumption or publication;
    # the four independent safety gates below remain false by default.
    s3_opaque_message_types: [2]
    # 0 = raw YDLIDAR, 1 = opaque for s3_expected_message_type.
    s3_expected_message_policy: 0
    s3_opaque_min_payload_bytes: 0
    s3_min_payload_bytes: 10
    s3_max_payload_bytes: 65535
    frame_id: laser_frame
    angle_min: -3.1415927
    angle_max: 3.1415927
    range_min: 0.10
    range_max: 8.0
    samples: 360
    scan_frequency_hz: 10.0
    # Invalid rays are +inf by default; set false to publish NaN instead.
    invalid_range_is_inf: true
    # Publish the YDLIDAR raw per-sample sync_quality byte (0..255), not a
    # calibrated physical intensity. It requires the matching parser layout.
    publish_intensities: false
    # Select the official driver's 3-byte quality+distance sample layout.
    ydlidar_intensities: false
    stale_after_ms: 500
    zero_packet_timeout_ms: 1000

    # Embedded read-only state adapters. The gateway is the only process that
    # owns the TCP connection. SRP v4 type 2 is locally reviewed, but live
    # odometry stays disabled pending STM/S3 captures and disconnect testing.
    allow_live_telemetry: false
    allow_offline_fixtures: true
    enable_live_odom: false
    publish_odom: false
    publish_tf: false
    odom_topic: /odom
    odom_frame_id: odom
    odom_child_frame_id: base_link
    require_outer_sequence: true
    track_width_m: 0.193
    wheel_diameter_m: 0.065
    wheel_speed_sign: [1.0, 1.0, 1.0, 1.0]
    sample_tick_period_s: 0.001
    min_dt_s: 0.000001
    max_dt_s: 1.0
    stale_timeout_ms: 500
    wheel_fifo_depth: 32
    require_source_freshness: true
    allow_sequence_wrap: true
    allow_tick_wrap: true
    telemetry_max_payload_bytes: 267
    # Both identities must be concrete before allow_live_telemetry can admit
    # a wheel sample. -1 deliberately keeps live wheel telemetry rejected.
    telemetry_expected_source_id: -1
    telemetry_expected_destination_id: -1
    # The state bridge only has a reviewed decoder for SCBP wheel status 0x0210.
    telemetry_wheel_message_type: 528
